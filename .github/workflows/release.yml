name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: desko-linux-x64
            binary_name: desko
          - os: macos-latest
            artifact_name: desko-macos-arm64
            binary_name: desko
          - os: macos-13
            artifact_name: desko-macos-x64
            binary_name: desko
          - os: windows-latest
            artifact_name: desko-windows-x64.exe
            binary_name: desko.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build executable
        run: bun build --compile --minify --sourcemap ./src/index.ts --outfile ${{ matrix.binary_name }}

      - name: Rename binary (Linux)
        if: runner.os == 'Linux'
        run: mv desko ${{ matrix.artifact_name }}

      - name: Rename binary (macOS)
        if: runner.os == 'macOS'
        run: mv desko ${{ matrix.artifact_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: mv desko.exe ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Copy install scripts
        run: |
          cp scripts/install.sh artifacts/
          cp scripts/install.ps1 artifacts/

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "desko ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          draft: false
          files: |
            artifacts/*
